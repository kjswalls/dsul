# XcodeGen spec for the dsul iPhone app. The .xcodeproj is generated from this
# file and never committed: run `xcodegen generate` in ios/ after every pull.
name: Dsul
options:
  bundleIdPrefix: app.dsul
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
packages:
  DsulCore:
    path: DsulCore
targets:
  Dsul:
    type: application
    platform: iOS
    sources:
      - path: Dsul
    dependencies:
      - package: DsulCore
    info:
      path: Dsul/Info.plist
      properties:
        CFBundleDisplayName: dsul
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CADisableMinimumFrameDurationOnPhone: true
        # The emailed sign-in link comes back as app.dsul.ios://auth/callback
        # (GoTrue.callbackScheme) from Safari or Mail, so the app owns the
        # scheme. Google's sheet catches the same scheme itself.
        CFBundleURLTypes:
          - CFBundleURLName: app.dsul.ios.auth
            CFBundleURLSchemes:
              - app.dsul.ios
        # Phase 2c (memory/plans/reminders-platforms.md §5.3): a background
        # refresh re-plans the iPhone's notifications while dsul isn't
        # opened (BackgroundRefresh.swift). No `remote-notification` and no
        # aps-environment until push (Phase 3); CI stays unsigned.
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - app.dsul.ios.reconcile
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: app.dsul.item-ref
            UTTypeDescription: dsul item reference
            UTTypeConformsTo:
              - public.data
            UTTypeTagSpecification: {}
    # Sign in with Apple (memory/plans/sign-in-with-apple.md). XcodeGen writes
    # this file on every generate and points CODE_SIGN_ENTITLEMENTS at it.
    entitlements:
      path: Dsul/Dsul.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dsul.ios
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Lime, the second App icon (lib/app-icons.ts); AppIconSwitcher.swift
        # swaps to it when the user picks Lime on the web.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Lime
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
  DsulTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DsulTests
    dependencies:
      - target: Dsul
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.dsul.ios.tests
schemes:
  Dsul:
    build:
      targets:
        Dsul: all
        DsulTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - DsulTests
