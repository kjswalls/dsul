<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- main.cjs shows this file, as a data: URL, in a view of its own over the window's top-right
     corner (main.cjs "Find in page"). It runs no script: find-preload.cjs wires it from the
     preload's isolated world, which is why script-src is 'none'. --bg here is
     lib/find-bar.cjs FIND_BAR_BG: change one, change both. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Find in page</title>
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --fg: #1d1f24; --muted: #6b6f78; --line: #d9d7d3; --hover: #efeeec; --miss: #b4382c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1e24; --fg: #e8e9ec; --muted: #8b8f99; --line: #2f343d; --hover: #272b33; --miss: #f08a7e; }
  }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    box-sizing: border-box;
    background: var(--bg);
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 10px;
    font: 13px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .bar { display: flex; align-items: center; gap: 2px; height: 100%; padding: 0 6px 0 12px; }
  input { flex: 1; min-width: 0; padding: 0; border: 0; outline: 0; background: none; color: inherit; font: inherit; }
  #count { padding: 0 8px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bar[data-none="true"] #count { color: var(--miss); }
  .rule { align-self: stretch; width: 1px; margin: 11px 4px; background: var(--line); }
  button { display: grid; place-items: center; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 6px; background: none; color: var(--muted); }
  button:hover { background: var(--hover); color: var(--fg); }
  button:focus-visible { outline: 2px solid var(--fg); outline-offset: -2px; }
  svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div class="bar" role="search" aria-label="Find in page">
  <input id="query" type="text" aria-label="Find in page" aria-describedby="count" spellcheck="false" autocomplete="off">
  <span id="count" role="status" aria-live="polite" aria-atomic="true"></span>
  <span class="rule" aria-hidden="true"></span>
  <button id="previous" type="button" aria-label="Previous match" aria-keyshortcuts="Shift+Enter" title="Previous match"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 10l4-4 4 4"/></svg></button>
  <button id="next" type="button" aria-label="Next match" aria-keyshortcuts="Enter" title="Next match"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg></button>
  <button id="close" type="button" aria-label="Close find bar" aria-keyshortcuts="Escape" title="Close"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7m0-7l-7 7"/></svg></button>
</div>
</body>
</html>
