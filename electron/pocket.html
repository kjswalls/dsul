<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The Do stuff pocket (main.cjs "Pocket"): a small always-on-top window, shown as a data: URL,
     with the current item, done and skip. It runs no script: pocket-preload.cjs wires it from the
     preload's isolated world, which is why script-src is 'none'. --bg here is lib/pocket.cjs
     POCKET_BG: change one, change both. The lime notch and the sprint bar are full strength in
     both schemes and never faded (CLAUDE.md). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>dsul pocket</title>
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --fg: #1d1f24; --muted: #6b6f78; --line: #d9d7d3; --hover: #efeeec; --lime: oklch(0.86 0.17 125); --lime-ink: oklch(0.32 0.07 130); }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1e24; --fg: #e8e9ec; --muted: #8b8f99; --line: #2f343d; --hover: #272b33; --lime: oklch(0.87 0.19 125); --lime-ink: oklch(0.26 0.06 130); }
  }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    box-sizing: border-box;
    position: relative;
    background: var(--bg);
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 12px;
    font: 12px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif;
    user-select: none;
    -webkit-app-region: drag;
  }
  button { -webkit-app-region: no-drag; }
  .notch { position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 0 3px 3px 0; background: var(--lime); }
  .pocket { display: flex; flex-direction: column; justify-content: center; gap: 6px; height: 100%; box-sizing: border-box; padding: 8px 8px 10px 16px; }
  .top { display: flex; align-items: center; gap: 6px; min-width: 0; }
  #line { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--muted); font-variant-numeric: tabular-nums; }
  #title { margin: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 14px; font-weight: 600; }
  .actions { display: flex; align-items: center; gap: 2px; }
  .actions .spacer { flex: 1; }
  button { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 9px; border: 0; border-radius: 7px; background: none; color: var(--muted); font: inherit; }
  button:hover { background: var(--hover); color: var(--fg); }
  button:focus-visible { outline: 2px solid var(--fg); outline-offset: -2px; }
  #done { background: var(--lime); color: var(--lime-ink); font-weight: 600; }
  #done:hover { background: var(--lime); color: var(--lime-ink); filter: brightness(0.96); }
  #close { width: 22px; height: 22px; padding: 0; justify-content: center; }
  svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  /* The sprint's time left, shrinking toward the left as it goes. */
  .sprint { position: absolute; left: 12px; right: 12px; bottom: 4px; height: 3px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .sprint[hidden] { display: none; }
  #left { height: 100%; width: 100%; border-radius: 3px; background: var(--lime); transform-origin: left; }
</style>
</head>
<body>
<span class="notch" aria-hidden="true"></span>
<main class="pocket" aria-label="Doing now">
  <div class="top">
    <span id="line" role="status" aria-live="polite">now</span>
    <button id="close" type="button" aria-label="Close the pocket" title="Close"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 4.5l7 7m0-7l-7 7"/></svg></button>
  </div>
  <p id="title"></p>
  <div class="actions">
    <button id="done" type="button"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>done</button>
    <button id="skip" type="button">skip</button>
    <span class="spacer"></span>
    <button id="open" type="button" title="Open dsul">open dsul</button>
  </div>
</main>
<div class="sprint" id="sprint" hidden aria-hidden="true"><div id="left"></div></div>
</body>
</html>
