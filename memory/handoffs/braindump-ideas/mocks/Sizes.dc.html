<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Size chips and quick wins</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;color:#1f2029}
a{color:#3b4a1c}a:hover{color:#1f2a0c}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 420px; height: 900px; box-sizing: border-box; background: #fbfbfb; padding: 24px 20px; display: flex; flex-direction: column; gap: 16px; font-family: 'Inter', system-ui, sans-serif; color: #1f2029">
  <div style="display: flex; align-items: center; gap: 6px; padding-left: 8px; font-weight: 700; font-size: 22px">dsul<span style="width: 7px; height: 7px; border-radius: 50%; background: #a8d64a; margin-top: 4px"></span></div>

  <div style="background: #eeeded; border-radius: 22px; padding: 8px; display: flex; flex-direction: column; gap: 8px">
    <div style="background: #ffffff; border-radius: 16px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 1px 3px rgba(20,20,40,0.08)">
      <div style="font-size: 16px"><span style="font-weight: 600">{{countNum}}</span> <span style="color: #8a8ea0">{{countWord}}</span></div>
      <div style="display: flex; gap: 14px; color: #8a8ea0">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8M16 5v4M10 15v4"></path></svg>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path></svg>
      </div>
    </div>
    <button type="button" onClick="{{toggle}}" style="height: 44px; border-radius: 14px; border: {{btnBorder}}; background: {{btnBg}}; color: {{btnInk}}; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2 2M10 2h4"></path></svg>
      {{btnLabel}}
    </button>
  </div>

  <sc-if value="{{quick}}" hint-placeholder-val="{{ false }}">
    <div style="font-size: 14px; color: #4d5162; padding: 0 8px; line-height: 1.5">6 quick ones. pick any. even one counts.</div>
  </sc-if>

  <div style="display: flex; flex-direction: column; gap: 14px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <div style="display: flex; align-items: center; gap: 8px; padding: 0 8px 4px">
          <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #8a8ea0">{{g.label}}</span>
          <span style="font-size: 12px; color: #a9adbe">{{g.count}}</span>
        </div>
        <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; gap: 12px; padding: 7px 8px; border-radius: 12px">
            <span style="width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid #c9cbd3; background: #f4f4f6; flex: none"></span>
            <span style="flex: 1; font-size: 15px">{{r.title}}</span>
            <span style="font-size: 12px; font-weight: 500; padding: 3px 9px; border-radius: 999px; background: {{r.chipBg}}; color: {{r.chipInk}}">{{r.chip}}</span>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>

  <sc-if value="{{showPicker}}" hint-placeholder-val="{{ true }}">
    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 12px; color: #8a8ea0; padding: 0 8px">tap a chip to change it. new items ask once:</div>
      <div style="background: #ffffff; border: 1px solid #dcdde1; border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
        <div style="font-size: 15px">return library books</div>
        <div style="display: flex; gap: 6px; flex-wrap: wrap">
          <button type="button" style="height: 32px; padding: 0 12px; border-radius: 999px; border: none; background: #eef6d8; color: #3b4a1c; font-size: 13px; font-weight: 500">quick</button>
          <button type="button" style="height: 32px; padding: 0 12px; border-radius: 999px; border: none; background: #e8eef9; color: #2d4470; font-size: 13px; font-weight: 500">errand</button>
          <button type="button" style="height: 32px; padding: 0 12px; border-radius: 999px; border: none; background: #fbf1d9; color: #6e5420; font-size: 13px; font-weight: 500">big</button>
          <button type="button" style="height: 32px; padding: 0 12px; border-radius: 999px; border: none; background: #f1ecf8; color: #55407a; font-size: 13px; font-weight: 500">fuzzy</button>
          <span style="font-size: 12px; color: #a9adbe; align-self: center; margin-left: 4px">AI can guess these</span>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":420,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { quick: false };
  }
  renderVals() {
    const all = [
      { label: 'quick', chip: 'quick', chipBg: '#eef6d8', chipInk: '#3b4a1c', rows: ['make a dentist appointment', 'schedule MRI appointment', 'email ICA', "check sammy's insurance", 'ask mom and the sibs about NJ trip', 'hang up trip map'] },
      { label: 'errands', chip: 'errand', chipBg: '#e8eef9', chipInk: '#2d4470', rows: ['Smog the Honda, sell to Cass', "get sammy's license"] },
      { label: 'big', chip: 'big', chipBg: '#fbf1d9', chipInk: '#6e5420', rows: ["clean spencer's room", 'cancel subscriptions', 'plan trip to europe', 'plan trip to China', 'make china trip video'] },
      { label: 'fuzzy', chip: 'fuzzy', chipBg: '#f1ecf8', chipInk: '#55407a', rows: ['budgets?', 'Figure out CPAP machine'] }
    ];
    const q = this.state.quick;
    const shown = q ? all.slice(0, 1) : all;
    const groups = shown.map((g) => Object.assign({}, g, { count: String(g.rows.length), rows: g.rows.map((t) => ({ title: t, chip: g.chip, chipBg: g.chipBg, chipInk: g.chipInk })) }));
    return {
      quick: q,
      showPicker: !q,
      groups: groups,
      countNum: q ? '6' : '15',
      countWord: q ? 'of 15' : 'undated',
      btnLabel: q ? 'show everything' : 'I have 15 minutes',
      btnBg: q ? '#ffffff' : '#b9e05a',
      btnInk: q ? '#1f2029' : '#2c3a12',
      btnBorder: q ? '1px solid #dcdde1' : 'none',
      toggle: () => this.setState({ quick: !q })
    };
  }
}
</script>
</body>
</html>
