<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Braindump at rest</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;color:#1f2029}
a{color:#3b4a1c}a:hover{color:#1f2a0c}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 420px; height: 900px; box-sizing: border-box; background: #fbfbfb; padding: 24px 20px; display: flex; flex-direction: column; gap: 18px; font-family: 'Inter', system-ui, sans-serif; color: #1f2029">
  <div style="display: flex; align-items: center; gap: 6px; padding-left: 8px; font-weight: 700; font-size: 22px">dsul<span style="width: 7px; height: 7px; border-radius: 50%; background: #a8d64a; margin-top: 4px"></span></div>

  <div style="background: #eeeded; border-radius: 22px; padding: 6px">
    <div style="background: #ffffff; border-radius: 16px; padding: 10px 10px 10px 16px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 1px 3px rgba(20,20,40,0.08)">
      <div style="font-size: 16px"><span style="font-weight: 600">15</span> <span style="color: #8a8ea0">undated</span></div>
      <div style="display: flex; align-items: center; gap: 12px; color: #8a8ea0">
        <button type="button" style="height: 32px; padding: 0 12px 0 10px; border-radius: 999px; border: 1px solid #dcdde1; background: #ffffff; color: #1f2029; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 7px"><span style="width: 7px; height: 7px; border-radius: 50%; background: #a8d64a"></span>do stuff</button>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8M16 5v4M10 15v4"></path></svg>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"></path></svg>
      </div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="15">
      <div style="display: flex; align-items: center; gap: 12px; padding: 7px 8px">
        <span style="width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid #c9cbd3; background: #f4f4f6; flex: none"></span>
        <span style="font-size: 15px">{{r.t}}</span>
      </div>
    </sc-for>
  </div>

  <div style="margin-top: auto; background: #f4f4f6; border-radius: 14px; padding: 12px 14px; font-size: 13px; color: #6b6f80; line-height: 1.5">at rest nothing changes: same list, same order, no sizes showing. the one new thing is the "do stuff" chip.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":420,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const t = ['Smog the Honda, sell to Cass', 'budgets?', 'make a dentist appointment', 'make china trip video', 'ask mom and the sibs about NJ trip', 'plan trip to europe', "get sammy's license", "check sammy's insurance", 'email ICA', 'cancel subscriptions', "clean spencer's room", 'hang up trip map', 'Figure out CPAP machine', 'schedule MRI appointment', 'plan trip to China'];
    return { rows: t.map((x) => ({ t: x })) };
  }
}
</script>
</body>
</html>
