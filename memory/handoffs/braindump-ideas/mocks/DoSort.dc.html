<!doctype html>
<html lang="en">
<head>

</head>
<body>
<x-dc>
<helmet>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>

a{color:#3b4a1c}a:hover{color:#1f2a0c}

</style>

<div style="width: 420px; height: 900px; box-sizing: border-box; background: #fbfbfb; padding: 24px 20px; display: flex; flex-direction: column; gap: 16px; font-family: 'Inter', system-ui, sans-serif; color: #1f2029">
  <div style="display: flex; align-items: center; gap: 6px; padding-left: 8px; font-weight: 700; font-size: 22px">dsul<span style="width: 7px; height: 7px; border-radius: 50%; background: #a8d64a; margin-top: 4px"></span></div>

  <div style="background: #eeeded; border-radius: 22px; padding: 6px">
    <div style="background: #ffffff; border-radius: 16px; padding: 10px 10px 10px 16px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 0 0 1.5px #b9e05a, 0 1px 3px rgba(20,20,40,0.08)">
      <div style="display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600"><span style="width: 8px; height: 8px; border-radius: 50%; background: #a8d64a"></span>do stuff</div>
      <button type="button" style="height: 32px; padding: 0 12px; border-radius: 999px; border: none; background: #f1f1f3; color: #4d5162; font-size: 13px; font-weight: 500">done for now</button>
    </div>
  </div>

  <div style="background: #ffffff; border: 1px solid #dcdde1; border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #8a8ea0">3 new things, how big?</div>
      <div style="font-size: 12px; color: #8a8ea0">1 of 3</div>
    </div>
    <div style="font-size: 20px; font-weight: 600">fix the squeaky door</div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button type="button" style="display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 12px; border-radius: 14px; border: 1.5px solid #9ccb3c; background: #eef6d8; color: #3b4a1c; text-align: left">
        <span style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v4l2.5 2"></path></svg>quick<span style="font-size: 11px; font-weight: 500; opacity: 0.7; margin-left: 2px">guess</span></span>
        <span style="font-size: 12px; opacity: 0.8">under 15 minutes</span>
      </button>
      <button type="button" style="display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 12px; border-radius: 14px; border: 1.5px solid transparent; background: #e6eefb; color: #2d4470; text-align: left">
        <span style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0113 0c0 5-6.5 11-6.5 11z"></path><circle cx="12" cy="10" r="2.2"></circle></svg>errand</span>
        <span style="font-size: 12px; opacity: 0.8">means going somewhere</span>
      </button>
      <button type="button" style="display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 12px; border-radius: 14px; border: 1.5px solid transparent; background: #fbf0d6; color: #6e5420; text-align: left">
        <span style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 4l9 5-9 5-9-5z"></path><path d="M3 14l9 5 9-5"></path></svg>big</span>
        <span style="font-size: 12px; opacity: 0.8">needs a real block</span>
      </button>
      <button type="button" style="display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 12px; border-radius: 14px; border: 1.5px solid transparent; background: #f1ebf9; color: #55407a; text-align: left">
        <span style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 10c2-3 4-3 6 0s4 3 6 0 3-2 4-1"></path><path d="M4 16c2-3 4-3 6 0s4 3 6 0 3-2 4-1"></path></svg>fuzzy</span>
        <span style="font-size: 12px; opacity: 0.8">not sure where to start</span>
      </button>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center">
      <button type="button" style="border: none; background: transparent; font-size: 13px; color: #3b4a1c; font-weight: 600; padding: 8px 0">keep all 3 guesses</button>
      <button type="button" style="border: none; background: transparent; font-size: 13px; color: #6b6f80; padding: 8px 0">skip for now</button>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 12px; background: linear-gradient(90deg, #eef6d8 0%, #eef6d8 55%, rgba(251,251,251,0) 100%); color: #3b4a1c"><span style="font-size: 13px; font-weight: 600">quick</span><span style="font-size: 13px; opacity: 0.7">6</span></div>
    <div style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 12px; background: linear-gradient(90deg, #e6eefb 0%, #e6eefb 55%, rgba(251,251,251,0) 100%); color: #2d4470"><span style="font-size: 13px; font-weight: 600">errands</span><span style="font-size: 13px; opacity: 0.7">2</span></div>
    <div style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 12px; background: linear-gradient(90deg, #fbf0d6 0%, #fbf0d6 55%, rgba(251,251,251,0) 100%); color: #6e5420"><span style="font-size: 13px; font-weight: 600">big</span><span style="font-size: 13px; opacity: 0.7">5</span></div>
    <div style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 12px; background: linear-gradient(90deg, #f1ebf9 0%, #f1ebf9 55%, rgba(251,251,251,0) 100%); color: #55407a"><span style="font-size: 13px; font-weight: 600">fuzzy</span><span style="font-size: 13px; opacity: 0.7">2</span></div>
  </div>

  <div style="margin-top: auto; background: #f4f4f6; border-radius: 14px; padding: 12px 14px; font-size: 13px; color: #6b6f80; line-height: 1.5">only when something new has no size yet. the outlined option is the guess (from your AI if connected, else from words like "call" or "pick up"). press 1 to 4 or tap. the size sticks for next time.</div>
</div>
</x-dc>
