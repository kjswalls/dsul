<!doctype html>
<html lang="en">
<head>

<title>Do stuff mode, dark</title>

</head>

<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>

a{color:#c4ea6a}a:hover{color:#d8f590}

</helmet>
<div style="width: 420px; height: 900px; box-sizing: border-box; background: #18191d; padding: 24px 20px; display: flex; flex-direction: column; gap: 16px; font-family: 'Inter', system-ui, sans-serif; color: #e8e9ee">
  <div style="display: flex; align-items: center; gap: 6px; padding-left: 8px; font-weight: 700; font-size: 22px">dsul<span style="width: 7px; height: 7px; border-radius: 50%; background: #b9e65a; margin-top: 4px"></span></div>

  <div style="background: #222328; border-radius: 22px; padding: 6px">
    <div style="background: #2c2d33; border-radius: 16px; padding: 10px 10px 10px 16px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 0 0 1.5px #b9e65a">
      <div style="display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600"><span style="width: 8px; height: 8px; border-radius: 50%; background: #b9e65a"></span>do stuff</div>
      <div style="display: flex; align-items: center; gap: 10px">
        <span style="font-size: 14px; color: #8b8fa0">2 done</span>
        <button type="button" style="height: 32px; padding: 0 12px; border-radius: 999px; border: none; background: #3a3b42; color: #c9cbd6; font-size: 13px; font-weight: 500">done for now</button>
      </div>
    </div>
  </div>

  <div style="background: #222328; border: 1px solid rgba(255,255,255,0.08); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: #8b8fa0">up next<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.02em; text-transform: none; padding: 2px 8px; border-radius: 999px; background: rgba(185,230,90,0.14); color: #c9ec7a">quick</span></div>
    <div style="font-size: 20px; font-weight: 600; line-height: 1.3">email ICA</div>
    <div style="display: flex; gap: 8px">
      <button type="button" style="flex: 1; height: 44px; border-radius: 12px; border: none; background: #b9e65a; color: #24300c; font-size: 14px; font-weight: 600">done</button>
      <button type="button" style="height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.12); background: transparent; color: #c9cbd6; font-size: 14px; font-weight: 500">skip</button>
      <button type="button" style="height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.12); background: transparent; color: #c9cbd6; font-size: 14px; font-weight: 500">put on today</button>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; flex-direction: column">
      <div style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 12px; background: linear-gradient(90deg, rgba(185,230,90,0.14) 0%, rgba(185,230,90,0.14) 55%, rgba(24,25,29,0) 100%); color: #c9ec7a">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v4l2.5 2"></path></svg>
        <span style="font-size: 13px; font-weight: 600">quick</span><span style="font-size: 13px; opacity: 0.7">4</span>
        <span style="margin-left: auto; font-size: 12px; color: #8b8fa0">about 30 min left</span>
      </div>
      <div style="display: flex; flex-direction: column; padding-top: 4px">
        <div style="display: flex; align-items: center; gap: 12px; padding: 6px 8px"><span style="width: 20px; height: 20px; border-radius: 6px; background: #b9e65a; flex: none; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#24300c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span><span style="font-size: 15px; color: #6c7080; text-decoration: line-through">make a dentist appointment</span></div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 6px 8px"><span style="width: 20px; height: 20px; border-radius: 6px; background: #b9e65a; flex: none; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#24300c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span><span style="font-size: 15px; color: #6c7080; text-decoration: line-through">schedule MRI appointment</span></div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 6px 8px; border-radius: 10px; background: rgba(255,255,255,0.05)"><span style="width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid #4a4c55; background: #24252a; flex: none"></span><span style="font-size: 15px">email ICA</span></div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 6px 8px"><span style="width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid #4a4c55; background: #24252a; flex: none"></span><span style="font-size: 15px">check sammy's insurance</span></div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 6px 8px"><span style="width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid #4a4c55; background: #24252a; flex: none"></span><span style="font-size: 15px">ask mom and the sibs about NJ trip</span></div>
        <div style="display: flex; align-items: center; gap: 12px; padding: 6px 8px"><span style="width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid #4a4c55; background: #24252a; flex: none"></span><span style="font-size: 15px">hang up trip map</span></div>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 12px; background: linear-gradient(90deg, rgba(120,160,240,0.16) 0%, rgba(120,160,240,0.16) 55%, rgba(24,25,29,0) 100%); color: #a9c3f5">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0113 0c0 5-6.5 11-6.5 11z"></path><circle cx="12" cy="10" r="2.2"></circle></svg>
      <span style="font-size: 13px; font-weight: 600">errands</span><span style="font-size: 13px; opacity: 0.7">2</span><span style="margin-left: auto; font-size: 12px; color: #8b8fa0">next time you are out</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 12px; background: linear-gradient(90deg, rgba(240,190,90,0.15) 0%, rgba(240,190,90,0.15) 55%, rgba(24,25,29,0) 100%); color: #f0cf8a">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 4l9 5-9 5-9-5z"></path><path d="M3 14l9 5 9-5"></path></svg>
      <span style="font-size: 13px; font-weight: 600">big</span><span style="font-size: 13px; opacity: 0.7">5</span><span style="margin-left: auto; font-size: 12px; color: #8b8fa0">needs a block</span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 12px; background: linear-gradient(90deg, rgba(170,140,230,0.16) 0%, rgba(170,140,230,0.16) 55%, rgba(24,25,29,0) 100%); color: #cdb9f3">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 10c2-3 4-3 6 0s4 3 6 0 3-2 4-1"></path><path d="M4 16c2-3 4-3 6 0s4 3 6 0 3-2 4-1"></path></svg>
      <span style="font-size: 13px; font-weight: 600">fuzzy</span><span style="font-size: 13px; opacity: 0.7">2</span><span style="margin-left: auto; font-size: 12px; color: #8b8fa0">find a first step</span>
    </div>
  </div>
</div>
</x-dc>
