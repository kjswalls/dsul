# Renews the Apple client secret in Supabase before it lapses (scripts/apple-secret-rotate.mjs).
# A secret lives 180 days and this runs every two months, so a failure leaves four months to fix
# it. A failed run opens an issue, because a scheduled run's failure email goes to whoever last
# edited the cron line, not necessarily the repo's owner.
#
# Secrets (Settings → Secrets and variables → Actions): APPLE_TEAM_ID, APPLE_KEY_ID,
# APPLE_PRIVATE_KEY (the .p8 file's whole text) and SUPABASE_ACCESS_TOKEN (a Supabase personal
# access token). memory/plans/sign-in-with-apple.md, "Rotation", has the details.
name: Apple secret rotation

on:
  schedule:
    - cron: '17 9 1 */2 *' # 09:17 UTC on the 1st of every other month
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check everything, write nothing'
        type: boolean
        default: true

concurrency:
  group: apple-secret-rotate
  cancel-in-progress: false

jobs:
  rotate:
    name: Renew Apple client secret
    if: github.repository == 'kjswalls/dsul'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Renew the secret
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: node scripts/apple-secret-rotate.mjs

      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Apple sign-in secret renewal failed" \
            --assignee kjswalls \
            --body "The scheduled renewal of the Apple client secret in Supabase failed: $RUN_URL

          Apple sign-in keeps working until the current secret expires. Fix the cause shown in the run log and re-run the workflow, or renew by hand (memory/plans/sign-in-with-apple.md, \"Rotation\")."
