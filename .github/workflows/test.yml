name: Tests

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The app and the OpenClaw plugin consume @dsul/types via its
      # COMMITTED dist/ — a src edit without a rebuild ships stale schemas
      # silently. Rebuild and fail on any drift (including untracked emits).
      - name: Check @dsul/types dist matches src
        run: |
          rm -rf packages/types/dist
          pnpm --filter @dsul/types build
          git add -A packages/types/dist
          git diff --cached --exit-code -- packages/types/dist || {
            echo '::error::packages/types/dist is stale — run `pnpm --filter @dsul/types build` and commit the result'
            exit 1
          }

      - name: Run unit tests
        run: pnpm run test:unit

  # Runs against a throwaway Supabase stack started ON THE RUNNER, never a
  # hosted project. This job used to take its keys from repo secrets, which were
  # PRODUCTION's; on 2026-09-24 four PRs' runs overlapped, retried for hours
  # with no timeout, and took the live project down (do.dsul.app could not log
  # in). The suite now refuses any non-loopback Supabase URL (assertLocalTarget,
  # tests/e2e/helpers/env.ts). Never give this job hosted keys back.
  e2e-tests:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          # `localsb-` so no cache built while the job baked prod's URL into the
          # bundle is ever restored.
          key: nextjs-localsb-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            nextjs-localsb-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - uses: supabase/setup-cli@v1
        with:
          # Pinned: local-setup.sh relies on `-x mailpit` and on the
          # `status -o env` key names, both of which have changed across CLIs.
          version: 2.117.0

      # Starts the stack, replays every migration onto an empty database, creates
      # the e2e user and writes .env.test. A failure here is a real failure (a
      # migration that no longer replays), so this step is NOT continue-on-error.
      - name: Start local Supabase
        run: ./scripts/local-setup.sh e2e

      # No job-level Supabase env on purpose: playwright.config.ts loads .env.test
      # with `override: false`, so any job env would silently win over the local
      # stack's file. The webServer (`pnpm build && pnpm start`) inherits the
      # values from the Playwright process.

      # Advisory until the suite is reliably green: its failures do not fail the
      # workflow, but a broken stack above still does.
      # Its own timeout, under the job's: a step that times out is a step
      # failure (absorbed by continue-on-error), a job that does is a red job.
      # ~20m locally with 4 workers; CI runs 1 worker with 2 retries.
      - name: Run E2E tests
        continue-on-error: true
        timeout-minutes: 45
        run: pnpm run e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
