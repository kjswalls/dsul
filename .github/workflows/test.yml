name: Tests

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The app and the OpenClaw plugin consume @dsul/types via its
      # COMMITTED dist/ — a src edit without a rebuild ships stale schemas
      # silently. Rebuild and fail on any drift (including untracked emits).
      - name: Check @dsul/types dist matches src
        run: |
          rm -rf packages/types/dist
          pnpm --filter @dsul/types build
          git add -A packages/types/dist
          git diff --cached --exit-code -- packages/types/dist || {
            echo '::error::packages/types/dist is stale — run `pnpm --filter @dsul/types build` and commit the result'
            exit 1
          }

      - name: Run unit tests
        run: pnpm run test:unit

  # OFF until it can run against a Supabase stack on the runner itself.
  #
  # This job used to take its Supabase keys from repo secrets, which were
  # PRODUCTION's. On 2026-09-24 four PRs' E2E runs overlapped, each retried for
  # hours with no timeout, and the load took the live project down (do.dsul.app
  # could not log in). The keys are gone from this file and the suite now refuses
  # any non-loopback Supabase URL (assertLocalTarget, tests/e2e/helpers/env.ts),
  # so even with this re-enabled it can only reach a local stack.
  #
  # To turn it back on: a step that runs `./scripts/local-setup.sh e2e` (after
  # supabase/setup-cli) before "Run E2E tests", then flip the `if:` back to
  # `github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'`.
  # That needs the migrations to replay onto an empty database first; today
  # `supabase db reset` stops early (see scripts/README.md).
  e2e-tests:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    continue-on-error: true
    if: false
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}-

      # No job-level Supabase env on purpose: playwright.config.ts loads .env.test
      # with `override: false`, so any job env would silently win over the local
      # stack's file. The webServer (`pnpm build && pnpm start`) inherits the
      # values from the Playwright process.

      - name: Run E2E tests
        run: pnpm run e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
